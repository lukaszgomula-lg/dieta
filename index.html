const ALKOHOL={'Piwo 5%':3.9,'Wino czerwone':10.6,'Wino białe':10.3,'Wódka 40%':33.4};
const MK_USDA=['wit_d_ug','b12_ug','zelazo_mg','wapn_mg','magnez_mg','cynk_mg','potas_mg','foliany_ug','epa_dha_mg'];
const MK=[...MK_USDA,'jod_ug'];
const MK_LBL={wit_d_ug:'Wit. D (µg)',b12_ug:'Wit. B12 (µg)',zelazo_mg:'Żelazo (mg)',wapn_mg:'Wapń (mg)',magnez_mg:'Magnez (mg)',cynk_mg:'Cynk (mg)',potas_mg:'Potas (mg)',foliany_ug:'Foliany (µg)',epa_dha_mg:'EPA+DHA (mg)',jod_ug:'Jod (µg)'};
const NUT=['kcal','bialko','tluszcz','nasycone','wegle','cukry','blonnik','sol'];
const PLYN=['woda_g','plyn_ml','alkohol_g'];
const ALLK=[...NUT,...MK,...PLYN];
const GEN=GENERIC.map(([n,k,b,t,w,c,f])=>{const m=MIKRO[n];
  const o={id:'g-'+norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),kod:'',nazwa:n,marka:'',kcal:k,bialko:b,tluszcz:t,nasycone:m&&m[10]!=null?m[10]:'',wegle:w,cukry:c,blonnik:f,sol:m&&m[11]!=null?m[11]:'',zrodlo:'baza ogólna',porcja_g:PORCJE[n]?PORCJE[n][0]:'',porcja_nazwa:PORCJE[n]?PORCJE[n][1]:''};
  if(m){o.usda=m[0];MK_USDA.forEach((key,i)=>o[key]=m[i+1]==null?'':m[i+1]);o.woda_g=m[12]==null?'':m[12]}
  o.napoj=NAPOJE.includes(n)?'TAK':'';o.alkohol_g=ALKOHOL[n]||'';
  return o});
const GEN_BY_ID=new Map(GEN.map(g=>[g.id,g]));
function suggestOdp(name){const n=norm(name);let best=null;
  GEN.forEach(g=>{if(!g.usda)return;const gn=norm(g.nazwa).replace(/\(.*?\)/g,'').trim();if(gn.length>=4&&n.includes(gn)&&(!best||gn.length>best[1]))best=[g.id,gn.length]});
  if(!best){const fw=n.split(/\s+/)[0];if(fw&&fw.length>=4){const g=GEN.find(g=>g.usda&&norm(g.nazwa).split(/\s+/)[0]===fw);if(g)best=[g.id,0]}}
  return best?best[0]:''}

const PORY=['Śniadanie','II śniadanie','Obiad','Podwieczorek','Kolacja','Przekąska'];
function guessPora(hm){const [h,m]=hm.split(':').map(Number);const t=h+m/60;
  if(t<4)return 'Przekąska';if(t<10)return 'Śniadanie';if(t<12)return 'II śniadanie';if(t<15.5)return 'Obiad';if(t<17.5)return 'Podwieczorek';if(t<21.5)return 'Kolacja';return 'Przekąska'}

/* ---------- wartości odżywcze ---------- */
const asItem=(o,typ)=>({...o,typ});
function findItem(typ,id){if(typ==='danie'){const d=db.dania.find(x=>String(x.id)===String(id));return d?asItem(d,'danie'):null}const p=prodIdx.get(String(id));return p?asItem(p,'produkt'):null}
function rawWeight(d){return db.skladniki.filter(s=>s.danie_id===d.id).reduce((a,s)=>a+num(s.gramy),0)}
function dishWeight(d){return num(d.waga_gotowa)>0?num(d.waga_gotowa):rawWeight(d)}
/* naczynia (tara) – zapisane w telefonie */
let naczynia=LS.get('naczynia',[]);
const tareSel=(id)=>`<select id="${id}" class="tare"><option value="">bez naczynia (netto)</option>${naczynia.map((n,i)=>`<option value="${i}">${esc(n.nazwa)} (${Math.round(n.g)} g)</option>`).join('')}</select>`;
const tareOf=sel=>{const i=sel&&sel.value;return i===''||i==null?0:num((naczynia[+i]||{}).g)};
const baseOfDish=d=>d.baza||String(d.nazwa||'').replace(/\s*\(\d{1,2}\.\d{1,2}\.\d{2}\)$/,'');
const val=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const microSrc=p=>GEN_BY_ID.get(String(p.id))||(p.odpowiednik?GEN_BY_ID.get(String(p.odpowiednik)):null)||null;
function per100(it){
  if(it.typ==='danie'){const t=Object.fromEntries(ALLK.map(k=>[k,null]));let W=0,n=0,nm=0;
    db.skladniki.filter(s=>s.danie_id===it.id).forEach(s=>{const g=num(s.gramy);W+=g;n++;const p=prodIdx.get(String(s.produkt_id))||GEN_BY_ID.get(String(s.produkt_id));if(!p)return;
      const q=per100(asItem(p,'produkt'));if(q._mz)nm++;ALLK.forEach(k=>{if(q[k]!=null)t[k]=(t[k]||0)+q[k]*g/100})});
    /* waga po ugotowaniu: ta sama ilość składników odżywczych w mniejszej masie (odparowała woda) */
    const Wc=num(it.waga_gotowa)>0?num(it.waga_gotowa):W;
    if(t.woda_g!=null&&Wc<W)t.woda_g=Math.max(0,t.woda_g-(W-Wc));
    ALLK.forEach(k=>{if(t[k]!=null)t[k]=Wc?t[k]*100/Wc:0});
    t._mz=n?`danie: mikro dla ${nm}/${n} składników`+(Wc!==W?` · po ugotowaniu ${Math.round(Wc)} g z ${Math.round(W)} g`:''):'';return t}
  const self=GEN_BY_ID.get(String(it.id))||null,src=microSrc(it),o={};
  NUT.forEach(k=>{const v=val(it[k]);o[k]=v!=null?v:(self?val(self[k]):null)});
  let own=0;
  MK.forEach(k=>{const v=val(it[k]),sv=src?val(src[k]):null;if(v!=null&&!(self&&v===val(self[k]))){o[k]=v;own++}else o[k]=sv});
  const us=src?(src===self?`USDA SR28 #${src.usda}`:`USDA SR28 #${src.usda} (odpowiednik: ${src.nazwa})`):'';
  o._mz=own?('własne ('+own+')'+(us?' + '+us:'')):us;
  const nap=(it.napoj||(self&&self.napoj))==='TAK',alk=val(it.alkohol_g)??(self?val(self.alkohol_g):null)??0;
  let wd=val(it.woda_g);if(wd==null&&src)wd=val(src.woda_g);
  if(wd==null&&nap)wd=Math.max(0,100-(o.bialko||0)-(o.tluszcz||0)-(o.wegle||0)-alk);
  o.woda_g=wd;o.alkohol_g=alk;o.plyn_ml=nap&&alk<0.5?100:0;
  return o}
const rk=(k,v)=>v==null?null:k==='kcal'?Math.round(v):Math.round(v*100)/100;
const calc=(p,g)=>{const o={};ALLK.forEach(k=>o[k]=p[k]==null?null:rk(k,p[k]*g/100));o._mz=p._mz||'';return o};
const macHTML=m=>`<div><b>${m.kcal??0}</b>kcal</div><div><b class="cB">${r1(m.bialko||0)}</b>białko</div><div><b class="cT">${r1(m.tluszcz||0)}</b>tłuszcz</div><div><b class="cW">${r1(m.wegle||0)}</b>węglow.</div>`;
const fv=v=>v==null?'–':String(r1(v)).replace('.',',');
const extraTxt=m=>`Błonnik ${fv(m.blonnik)} g · Cukry ${fv(m.cukry)} g · Sól ${fv(m.sol)} g`;

/* ---------- komunikacja z arkuszem ---------- */
async function apiGet(params){const q=new URLSearchParams({...params,token:cfg.token});const r=await fetch(cfg.url+'?'+q);const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function apiPost(action,data){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action,data})});const j=await r.json();if(j.error)throw new Error(j.error);return j}

function setSync(){const b=$$('#sync');b.textContent=queue.length?`⟳ ${queue.length}`:'✓';b.classList.toggle('pending',!!queue.length)}
function enqueue(action,data){queue.push({action,data});LS.set('queue',queue);setSync();flush()}
let flushing=false;
async function flush(){if(flushing||!cfg.url)return;flushing=true;
  try{while(queue.length){try{await apiPost(queue[0].action,queue[0].data);lastErr=''}catch(e){lastErr=e.message;break}queue.shift();LS.set('queue',queue)}}
  finally{flushing=false;setSync()}}

async function refreshDb(){
  const j=await apiGet({action:'init'});
  storeCele(j.cele);if(j.supl){suplData=j.supl;LS.set('supl',suplData)}
  const P=j.produkty.map(p=>({...p,id:String(p.id),kod:String(p.kod??'')}));
  const D=j.dania.map(d=>({...d,id:String(d.id),porcje:num(d.porcje)||1,waga_gotowa:num(d.waga_gotowa)||''}));
  const S=j.skladniki.map(s=>({danie_id:String(s.danie_id),produkt_id:String(s.produkt_id),gramy:num(s.gramy)}));
  queue.forEach(op=>{if(op.action==='addProduct'&&!P.some(x=>x.id===op.data.id))P.push(op.data);
    if(op.action==='addDish'&&!D.some(x=>x.id===op.data.danie.id)){D.push(op.data.danie);S.push(...op.data.skladniki)}});
  db={produkty:P,dania:D,skladniki:S};saveDb()}

function applyQueue(list,d){queue.forEach(op=>{const e=op.data;
  if(op.action==='addEntry'||op.action==='updateEntry'){list=list.filter(x=>x.id!==e.id);if(e.data===d)list.push(e)}
  else if(op.action==='deleteEntry')list=list.filter(x=>x.id!==e.id)});return list}

async function loadDay(){renderDay();if(!cfg.url)return;const d=curDate;
  try{const j=await apiGet({action:'day',date:d});
    let list=j.entries.map(e=>({...e,id:String(e.id),godzina:String(e.godzina),ilosc_g:num(e.ilosc_g),kcal:num(e.kcal),bialko:num(e.bialko),tluszcz:num(e.tluszcz),wegle:num(e.wegle)}));
    dayCache[d]=applyQueue(list,d);saveDays();
    if(j.v>=3){storeCele(j.cele);if(j.cel)storeCele([j.cel])}
    if(j.v>=4){if(j.supl){suplData=j.supl;LS.set('supl',suplData)}let sl=(j.suplLog||[]).map(x=>({...x,id:String(x.id)}));
      queue.forEach(op=>{if(op.action==='logSupl'){sl=sl.filter(x=>x.id!==op.data.id);if(op.data.data===d)sl.push(op.data)}else if(op.action==='delSupl')sl=sl.filter(x=>x.id!==op.data.id)});
      suplLog[d]=sl;saveSupl()}if(j.v>=2){let dz=j.dzien||null;queue.forEach(op=>{if(op.action==='setDay'&&op.data.data===d)dz=op.data});dniCache[d]=dz;LS.set('dni',dniCache);backfill(d)}
    if(d===curDate)renderDay()}catch(e){lastErr=e.message}}
/* uzupełnia brakujące wartości (błonnik, cukry, sól, mikro) w starszych wpisach */
function backfill(d){(dayCache[d]||[]).slice().forEach(e=>{const it=findItem(e.typ,e.ref_id);const g=num(e.ilosc_g);if(!it||!(g>0))return;
  const m=calc(per100(it),g),u={...e};let ch=false;
  if(e.typ==='danie')NUT.forEach(k=>{const cur=val(u[k]),nw=m[k];if(nw!=null&&(cur==null||Math.abs(cur-nw)>0.011)){u[k]=nw;ch=true}});
  else NUT.forEach(k=>{if(val(u[k])==null&&m[k]!=null){u[k]=m[k];ch=true}});
  /* mikro i płyny zawsze zgodne z aktualnym produktem (np. po oznaczeniu jako napój albo zmianie odpowiednika) */
  [...MK,...PLYN].forEach(k=>{const cur=val(u[k]),nw=m[k];if(nw==null?cur!=null:(cur==null||Math.abs(cur-nw)>0.011)){u[k]=nw==null?'':nw;ch=true}});
  if(ch){u.mikro_zrodlo=m._mz||'';upsertLocal(u);enqueue('updateEntry',u)}})}
let dniCache=LS.get('dni',{});
let celeCache=LS.get('cele',{});
function storeCele(arr){if(!Array.isArray(arr))return;arr.forEach(c=>{if(c&&c.data)celeCache[String(c.data)]=c});LS.set('cele',celeCache)}
function setDayClosed(d,closed){
  if(closed)planFor(d).filter(p=>p._req==='req'&&!logFor(d,p.id)).forEach(p=>putSupl(suplRec(d,p,'pominiete','')));const o={data:d,zamkniety:closed?'TAK':'',zamknieto:closed?isoNow():''};dniCache[d]=o;LS.set('dni',dniCache);enqueue('setDay',o);renderDay();toast(closed?'Dzień zamknięty ✓':'Dzień otwarty')}
function upsertLocal(e){for(const d in dayCache)dayCache[d]=dayCache[d].filter(x=>x.id!==e.id);(dayCache[e.data]=dayCache[e.data]||[]).push(e);saveDays()}
function deleteLocal(id){for(const d in dayCache)dayCache[d]=dayCache[d].filter(x=>x.id!==id);saveDays()}
function pushRecent(typ,id){recent=recent.filter(r=>!(r.typ===typ&&r.id===id));recent.unshift({typ,id});recent=recent.slice(0,25);LS.set('recent',recent)}

/* niebieski: za mało, zielony: w normie, czerwony: przekroczone. Kcal: 93–105%, makro: 90–110% */
function goalHTML(c,T){if(!c||!(num(c.kcal)>0||num(c.woda_ml)>0))return'';
  const R=[['Kalorie','kcal',T.kcal,'',.93,1.05],['Białko','bialko',T.b,' g',.9,1.1],['Tłuszcz','tluszcz',T.t,' g',.9,1.1],['Węglow.','wegle',T.w,' g',.9,1.1],['Woda łącznie','woda_ml',T.wd||0,' l',.9,1.35]];
  const rows=R.filter(r=>num(c[r[1]])>0).map(([n,k,v,u,lo,hi])=>{const g=num(c[k]),p=v/g,cl=p<lo?'g-lo':p>hi?'g-hi':'g-ok';
    const f=x=>u===' l'?String(Math.round(x/100)/10).replace('.',','):Math.round(x);
    return `<div class="gr ${cl}"><span class="nm">${n}</span><span class="bar"><i style="width:${Math.min(100,Math.round(p*100))}%"></i></span><span class="v"><b>${f(v)}</b> / ${f(g)}${u}</span></div>`}).join('');
  const typ=c.typ_dnia?esc(String(c.typ_dnia)):'',uw=c.uwaga?' · '+esc(String(c.uwaga)):'';
  return `<div class="goal"><div class="goal-h"><span>Cel dnia${typ?' · '+typ:''}${uw}</span></div>${rows}</div>`}

/* ---------- suplementy i leki ---------- */
function saveSupl(){const lim=addDays(today(),-60);for(const d in suplLog)if(d<lim)delete suplLog[d];LS.set('suplLog',suplLog)}
function dayKind(d){const c=celeCache[d];if(!c||!c.typ_dnia)return null;const t=norm(c.typ_dnia);return t.includes('tren')&&!t.includes('nietren')?'T':'NT'}
function planFor(d){const kind=dayKind(d);
  return (suplData.plan||[]).filter(p=>String(p.aktywny).toUpperCase()==='TAK'&&(!p.od||String(p.od)<=d)&&(!p.do||String(p.do)>=d)).map(p=>{const k=norm(p.kiedy||'codziennie');let r;
    if(k.startsWith('opc'))r='opt';else if(k.startsWith('nietren'))r=kind==='NT'?'req':kind==='T'?null:'opt';else if(k.startsWith('tren'))r=kind==='T'?'req':kind==='NT'?null:'opt';else r='req';
    return r?{...p,_req:r}:null}).filter(Boolean)}
const suplProd=id=>(suplData.produkty||[]).find(x=>String(x.id)===String(id));
const logFor=(d,pid)=>(suplLog[d]||[]).find(l=>l.plan_id===pid);
function putSupl(o){const d=o.data;suplLog[d]=(suplLog[d]||[]).filter(x=>x.id!==o.id);suplLog[d].push(o);saveSupl();enqueue('logSupl',o)}
function dropSupl(d,id){suplLog[d]=(suplLog[d]||[]).filter(x=>x.id!==id);saveSupl();enqueue('delSupl',{id})}
function suplRec(d,p,status,godz){const ex=logFor(d,p.id);return{id:ex?ex.id:uid(),data:d,plan_id:p.id,produkt_id:p.produkt_id||'',nazwa:p.nazwa||p.skladnik||'',dawka:String(p.dawka??''),jedn:p.jedn||'',pora:p.pora||'',status,godzina:godz,zapisano:isoNow()}}
function suplHTML(d){const plan=planFor(d),log=suplLog[d]||[];if(!plan.length&&!log.length&&!(suplData.plan||[]).length)return'';
  const req=plan.filter(p=>p._req==='req'),done=req.filter(p=>{const l=logFor(d,p.id);return l&&l.status==='przyjete'}).length,c=isCollapsed('__supl');
  const row=p=>{const l=logFor(d,p.id),on=l&&l.status==='przyjete',sk=l&&l.status==='pominiete',pr=suplProd(p.produkt_id);
    const sub=[[p.dawka,p.jedn].filter(Boolean).join(' '),p.dawka_skladnika,pr&&pr.nazwa&&pr.nazwa!==p.nazwa?pr.nazwa+(pr.marka?' ('+pr.marka+')':''):''].filter(Boolean).join(' · ');
    return `<button class="sup${on?' on':''}${sk?' skip':''}" data-sp="${esc(p.id)}"><span class="ck2">${on?'✓':sk?'–':''}</span><span class="nm"><b>${esc(p.nazwa||p.skladnik)}</b><small>${esc(sub)}${p.uwagi?' · '+esc(p.uwagi):''}</small></span><span class="k">${on?esc(l.godzina):sk?'pominięte':''}</span></button>`};
  let body='';const gs=[...PORY_S,...new Set(req.map(p=>p.pora).filter(x=>x&&!PORY_S.includes(x)))];
  gs.forEach(g=>{const ps=req.filter(p=>(p.pora||'dowolnie')===g);if(ps.length)body+=`<div class="slbl">${esc(g)}</div>`+ps.map(row).join('')});
  const opt=plan.filter(p=>p._req==='opt');if(opt.length)body+=`<div class="slbl">opcjonalnie${dayKind(d)?'':' / bez celu dnia'}</div>`+opt.map(row).join('');
  const ex=log.filter(l=>!l.plan_id);if(ex.length)body+='<div class="slbl">poza planem</div>'+ex.map(l=>`<button class="sup on" data-sx="${esc(l.id)}"><span class="ck2">✓</span><span class="nm"><b>${esc(l.nazwa)}</b><small>${esc([l.dawka,l.jedn].filter(Boolean).join(' '))}</small></span><span class="k">${esc(l.godzina)}</span></button>`).join('');
  if(!plan.length)body+='<p class="muted" style="margin:8px 16px">Brak aktywnego planu na ten dzień – ustala go trener.</p>';
  body+='<div class="grp-act" style="padding-left:16px;background:none"><button class="btn ghost" id="supX">+ Spoza planu</button></div>';
  return `<section class="meal"><div class="meal-h"><button class="meal-t" data-tog="__supl"><span class="chev">${c?'▸':'▾'}</span><span class="nm"><b>💊 Suplementy i leki</b><small>${req.length?`${done}/${req.length} przyjęte`:'brak pozycji obowiązkowych'}</small></span></button></div>${c?'':body}</section>`}
function suplItemSheet(d,p){const l=logFor(d,p.id);
  const ov=sheet(p.nazwa||p.skladnik,`<p class="muted" style="margin:0">${esc([[p.dawka,p.jedn].filter(Boolean).join(' '),p.pora,p.uwagi].filter(Boolean).join(' · '))}</p>
    <label>Godzina przyjęcia<input type="time" id="st" value="${esc(l&&l.godzina||nowHM())}"></label>
    <button class="btn primary big" id="ok">✓ Przyjęte</button><button class="btn big" id="sk">Pominięte</button>
    ${l?'<button class="btn ghost big danger" id="rm">Wyczyść</button>':''}`);
  $(ov,'#ok').onclick=()=>{putSupl(suplRec(d,p,'przyjete',$(ov,'#st').value||nowHM()));ov.close();renderDay()};
  $(ov,'#sk').onclick=()=>{putSupl(suplRec(d,p,'pominiete',''));ov.close();renderDay()};
  const rm=$(ov,'#rm');if(rm)rm.onclick=()=>{dropSupl(d,l.id);ov.close();renderDay()}}
function suplExtraSheet(d){const ov=sheet('Spoza planu',`<label>Nazwa *<input id="sn" placeholder="np. Ibuprom" autocomplete="off"></label>
    <div class="grid2"><label>Dawka<input id="sd" inputmode="decimal" placeholder="1"></label><label>Jednostka<input id="sj" placeholder="tabl."></label></div>
    <label>Godzina<input type="time" id="st" value="${nowHM()}"></label><button class="btn primary big" id="ok">Zapisz</button>`);
  $(ov,'#ok').onclick=()=>{const n=$(ov,'#sn').value.trim();if(!n)return toast('Podaj nazwę');

function itemsHTML(es){const seen=new Set();return es.map(e=>{const g=e.grupa_id;if(!g)return rowE(e);if(seen.has(g))return'';seen.add(g);

/* ---------- zbiorcza zmiana godziny / pory ---------- */
function batchSheet(entries,checked,title){
  if(!entries.length)return;
  const sel=new Set(checked.map(String));
  const ord=e=>{const i=PORY.indexOf(e.pora);return i<0?99:i};
  const ents=entries.slice().sort((a,b)=>ord(a)-ord(b)||String(a.godzina).localeCompare(String(b.godzina)));
  const groups=[...new Set(ents.map(e=>e.pora))];
  const ov=sheet(title,`
    <div class="row2" style="margin-bottom:8px"><button class="btn ghost" id="all">Zaznacz wszystkie</button><button class="btn ghost" id="none">Odznacz</button></div>
    ${groups.map(g=>(groups.length>1?`<div class="lbl">${esc(g)}</div>`:'')+ents.filter(e=>e.pora===g).map(e=>`<label class="ck"><input type="checkbox" data-id="${esc(e.id)}"${sel.has(e.id)?' checked':''}><span class="nm"><b>${esc(e.nazwa)}</b><small>${r1(num(e.ilosc_g))} g · ${esc(e.godzina)}</small></span></label>`).join('')).join('')}
    <label>Godzina spożycia<input type="time" id="bt"></label>
    <div class="lbl">Pora posiłku</div>
    <div class="chips" id="bp">${PORY.map(p=>`<button class="chip" data-p="${esc(p)}">${p}</button>`).join('')}</div>
    <button class="btn primary big" id="ok"></button>
    <button class="btn big" id="grp">🍽 Połącz w danie</button>
    <button class="btn ghost big danger" id="del"></button>`,{full:ents.length>4});
  const bt=$(ov,'#bt');let pora=null,tT=false,pT=false;
  const chosen=()=>ents.filter(e=>sel.has(e.id));
  const setPora=p=>{pora=p;ov.querySelectorAll('#bp .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===p))};
  function sync(){const s=chosen(),ts=[...new Set(s.map(e=>String(e.godzina)))],ps=[...new Set(s.map(e=>e.pora))];
    if(!tT)bt.value=ts.length===1?ts[0]:'';
    if(!pT)setPora(ps.length===1?ps[0]:null);
    const ok=$(ov,'#ok'),del=$(ov,'#del');
    ok.textContent=`Zastosuj do zaznaczonych (${s.length})`;ok.disabled=!s.length;
    del.textContent=`Usuń zaznaczone (${s.length})`;del.disabled=!s.length;
    const gb=$(ov,'#grp');gb.textContent=`🍽 Połącz w danie (${s.length})`;gb.disabled=s.length<2}
  const boxes=()=>ov.querySelectorAll('input[type=checkbox]');
  boxes().forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);sync()});
  $(ov,'#all').onclick=()=>{boxes().forEach(c=>{c.checked=true;sel.add(c.dataset.id)});sync()};
  $(ov,'#none').onclick=()=>{boxes().forEach(c=>{c.checked=false});sel.clear();sync()};
  bt.oninput=bt.onchange=()=>{tT=true};
  ov.querySelectorAll('#bp .chip').forEach(b=>b.onclick=()=>{pT=true;setPora(b.dataset.p)});
  $(ov,'#ok').onclick=()=>{const s=chosen();if(!s.length)return;const t=bt.value;let n=0;
    s.forEach(e=>{const u={...e};if(t)u.godzina=t;if(pora)u.pora=pora;if(u.godzina===e.godzina&&u.pora===e.pora)return;
      u.zmieniono=isoNow();upsertLocal(u);enqueue('updateEntry',u);n++});
    ov.close();renderDay();toast(n?`Zmieniono: ${n}`:'Bez zmian')};
  $(ov,'#grp').onclick=()=>{const s=chosen();if(s.length<2)return;ov.close();groupForm(s,false)};
  $(ov,'#del').onclick=()=>{const s=chosen();if(!s.length||!confirm(`Usunąć zaznaczone pozycje (${s.length})?`))return;
    s.forEach(e=>{deleteLocal(e.id);enqueue('deleteEntry',{id:e.id})});ov.close();renderDay();toast('Usunięto')};
  sync()}

/* ---------- danie z wpisów (grupa) ---------- */
function groupNames(){const set=new Set(LS.get('grpNames',[]));Object.values(dayCache).forEach(es=>es.forEach(e=>{if(e.danie_nazwa)set.add(baseName(e.danie_nazwa))}));return[...set].sort((a,b)=>a.localeCompare(b,'pl'))}
function groupForm(ents,edit){
  const g0=ents[0],kc=ents.reduce((a,x)=>a+num(x.kcal),0),w=ents.reduce((a,x)=>a+num(x.ilosc_g),0);
  const ov=sheet(edit?'Danie':'Połącz w danie',`
    <p class="muted" style="margin:0 0 4px">${ents.length} składników · ${Math.round(w)} g · ${Math.round(kc)} kcal</p>
    <label>Nazwa dania *<input id="gn" list="gnl" value="${esc(edit?baseName(g0.danie_nazwa):'')}" placeholder="np. Tortilla z tofu" autocomplete="off"></label>
    <datalist id="gnl">${groupNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <label>Ile sztuk / porcji (opcjonalnie)<input id="gs" inputmode="decimal" value="${edit&&num(g0.grupa_szt)>0?fv(num(g0.grupa_szt)):''}" placeholder="np. 2"></label>
    <p class="muted">W arkuszu zapisze się z datą, np. „… (${dSuffix(g0.data)})”.${edit?'':' Wszystkie składniki dostaną wspólną porę i godzinę.'}</p>
    <button class="btn primary big" id="ok">${edit?'Zapisz':'Połącz w danie'}</button>
    ${edit?`<button class="btn big" id="tm">🕒 Zmień godzinę / porę dania</button>
    <button class="btn big" id="sv">⭐ Zapisz jako danie do powtórzenia</button>
    <button class="btn ghost big danger" id="un">Rozłącz (zostaw składniki)</button>`:''}`);
  const nameIn=$(ov,'#gn');if(!edit)setTimeout(()=>nameIn.focus(),250);
  const apply=(fn)=>{ents.forEach(e=>{const u=fn({...e});u.zmieniono=isoNow();upsertLocal(u);enqueue('updateEntry',u)})};
  $(ov,'#ok').onclick=()=>{const nm=nameIn.value.trim();if(!nm)return toast('Podaj nazwę dania');
    const sz=num($(ov,'#gs').value),szt=sz>0?r1(sz):'';
    LS.set('grpNames',[nm,...LS.get('grpNames',[]).filter(x=>x!==nm)].slice(0,40));
    if(edit){apply(u=>{u.danie_nazwa=`${nm} (${dSuffix(u.data)})`;u.grupa_szt=szt;return u})}
    else{const gid=uid(),srt=ents.slice().sort((a,b)=>String(a.godzina).localeCompare(String(b.godzina))),t0=srt[0].godzina;
      const cnt={};ents.forEach(e=>cnt[e.pora]=(cnt[e.pora]||0)+1);const pora=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      apply(u=>{u.grupa_id=gid;u.danie_nazwa=`${nm} (${dSuffix(u.data)})`;u.grupa_szt=szt;u.godzina=t0;u.pora=pora;return u});
      collapsed[pora]=false;LS.set('collapsed',collapsed)}
    ov.close();renderDay();toast(edit?'Zapisano':'Połączono w danie')};
  if(!edit)return;
  $(ov,'#tm').onclick=()=>{ov.close();batchSheet(ents,ents.map(e=>e.id),baseName(g0.danie_nazwa)+' – godzina')};
  $(ov,'#un').onclick=()=>{if(!confirm('Rozłączyć danie? Składniki zostaną jako osobne pozycje.'))return;
    apply(u=>{u.grupa_id='';u.danie_nazwa='';u.grupa_szt='';return u});ov.close();renderDay();toast('Rozłączono')};
  $(ov,'#sv').onclick=()=>{const nm=nameIn.value.trim()||baseName(g0.danie_nazwa);
    /* składniki będące daniami rozkładamy na ich produkty w odpowiedniej proporcji */
    const acc=new Map();const addP=(pid,g)=>acc.set(String(pid),(acc.get(String(pid))||0)+g);let miss=0;
    ents.forEach(e=>{const g=num(e.ilosc_g);if(e.typ==='produkt')return addP(e.ref_id,g);
      const sk0=db.skladniki.filter(x=>String(x.danie_id)===String(e.ref_id)),W=sk0.reduce((a,x)=>a+num(x.gramy),0);
      if(!W){miss++;return}sk0.forEach(x=>addP(x.produkt_id,num(x.gramy)*g/W))});
    if(!acc.size)return toast('Brak składników do zapisania');
    const exists=db.dania.some(d=>norm(d.nazwa)===norm(nm));const dn=exists?`${nm} (${dSuffix(g0.data)})`:nm;
    const sz=num($(ov,'#gs').value);
    const sk=[...acc].map(([pid,g])=>({danie_id:'',produkt_id:pid,gramy:r1(g)}));
    const d={id:uid(),nazwa:dn,porcje:sz>0?r1(sz):1,waga_g:r1(sk.reduce((a,x)=>a+x.gramy,0)),dodano:isoNow()};sk.forEach(x=>x.danie_id=d.id);
    db.dania.push(d);db.skladniki.push(...sk);saveDb();enqueue('addDish',{danie:d,skladniki:sk});
    toast(`Zapisano danie „${dn}” · ${Math.round(d.waga_g)} g${miss?' (pominięto '+miss+' nieznane danie)':''}`)}}

/* ---------- arkusze (okna) ---------- */
function sheet(title,body,{full=false}={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet${full?' full':''}"><div class="sh-head"><button class="icon" data-close aria-label="Zamknij">✕</button><h2>${esc(title)}</h2><span></span></div><div class="sh-body">${body}</div></div>`;
  ov.close=()=>{if(ov._closed)return;ov._closed=true;ov.classList.remove('open');setTimeout(()=>ov.remove(),200);ov.onclose&&ov.onclose()};
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))ov.close()});
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));return ov}

/* ---------- wybór produktu / dania ---------- */
function openAdd(pora){openPicker({mode:'entry',onPick:it=>entryForm(it,{pora})})}
function openPicker({mode,onPick}){
  const ov=sheet(mode==='entry'?'Dodaj do dziennika':'Dodaj składnik',`
    <div class="search"><input id="q" placeholder="Szukaj${mode==='entry'?' produktu lub dania':' produktu'}…" autocomplete="off"><button class="btn" id="scan">▥ Skanuj</button></div>
    <div id="list"></div>
    <div class="row2" style="margin-top:12px"><button class="btn ghost" id="newP">+ Nowy produkt</button>${mode==='entry'?'<button class="btn ghost" id="newD">+ Nowe danie</button>':''}</div>`,{full:true});
  const q=$(ov,'#q'),list=$(ov,'#list');
  const pick=it=>{ensureProduct(it);ov.close();onPick(it)};
  const dishPool=()=>{const by={};db.dania.forEach(d=>{(by[norm(baseOfDish(d))]=by[norm(baseOfDish(d))]||[]).push(d)});
    return Object.values(by).flatMap(vs=>{vs.sort((a,b)=>String(b.wersja||b.dodano).localeCompare(String(a.wersja||a.dodano)));
      const act=vs.filter(d=>d.status!=='zjedzone');return (act.length?act:[vs[0]]).map(d=>asItem(d,'danie'))})};
  const pool=()=>[...db.produkty.map(p=>asItem(p,'produkt')),...GEN.filter(g=>!prodIdx.has(g.id)).map(g=>asItem(g,'produkt')),...(mode==='entry'?dishPool():[])];
  const sub=it=>{const b=it.typ==='danie'?'Danie':it.zrodlo==='baza ogólna'?'Baza ogólna':esc(it.marka||'Mój produkt');
    return it.typ!=='danie'&&num(it.porcja_g)>0?`${b} · ${esc(it.porcja_nazwa||'porcja')} = ${r1(num(it.porcja_g))} g`:b};
  function render(){const s=norm(q.value).trim();let items,head='';
    if(!s){items=recent.map(r=>findItem(r.typ,r.id)).filter(it=>it&&(mode==='entry'||it.typ==='produkt'));
      head=items.length?'<div class="lbl">Ostatnio używane</div>':'<p class="muted">Zacznij pisać albo zeskanuj kod kreskowy.</p>'}
    else{const w=s.split(/\s+/);items=pool().filter(it=>{const h=norm(it.nazwa+' '+(it.marka||''));return w.every(x=>h.includes(x))})
      .sort((a,b)=>(a.typ==='danie'&&b.typ==='danie'&&norm(baseOfDish(a))===norm(baseOfDish(b))?String(b.wersja||b.dodano).localeCompare(String(a.wersja||a.dodano)):0)||(norm(b.nazwa).startsWith(w[0])-norm(a.nazwa).startsWith(w[0]))||((a.zrodlo==='baza ogólna')-(b.zrodlo==='baza ogólna'))||a.nazwa.localeCompare(b.nazwa,'pl'));
      head=items.length?'':'<p class="muted">Brak w twojej bazie i bazie ogólnej.</p>'}
    items=items.slice(0,40);

/* ---------- skaner ---------- */
function openScanner(onCode){
  const ov=sheet('Skanuj kod',`<div id="reader"></div><p class="muted c" id="hint" style="display:flex">Nakieruj aparat na kod kreskowy</p>
    <div class="search"><input id="man" inputmode="numeric" placeholder="lub wpisz kod ręcznie"><button class="btn" id="manOk">OK</button></div>`,{full:true});
  let sc=null,done=false;
  const stop=async()=>{try{if(sc&&sc.isScanning)await sc.stop()}catch{}};
  ov.onclose=stop;
  const finish=code=>{if(done||!code)return;done=true;if(navigator.vibrate)navigator.vibrate(60);ov.close();onCode(code)};
  $(ov,'#manOk').onclick=()=>finish($(ov,'#man').value.replace(/\D/g,''));
  if(typeof Html5Qrcode==='undefined'){$(ov,'#reader').innerHTML='<p class="muted c" style="color:#ccc;padding:40px 16px">Skaner niedostępny – wpisz kod ręcznie.</p>';return}
  const F=Html5QrcodeSupportedFormats;
  sc=new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  sc.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.85,320)),height:Math.floor(Math.min(h*.45,150))})},t=>finish(String(t).trim()),()=>{})
    .catch(()=>{$(ov,'#reader').innerHTML='<p class="muted c" style="color:#ccc;padding:40px 16px">Brak dostępu do aparatu – zezwól w przeglądarce albo wpisz kod ręcznie.</p>'});
}
function ensureProduct(it){
  if(it&&it.typ==='produkt'&&!prodIdx.has(String(it.id))){const p={...it};delete p.typ;delete p.usda;delete p.woda_g;MK.forEach(k=>delete p[k]);p.dodano=isoNow();db.produkty.push(p);saveDb();enqueue('addProduct',p)}

function offToPre(pr,code){const n=pr.nutriments||{};
  let kcal=n['energy-kcal_100g'];if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;
  return{kod:code||pr.code||'',nazwa:pr.product_name_pl||pr.product_name||'',marka:(pr.brands||'').split(',')[0].trim(),
    kcal,bialko:n.proteins_100g,tluszcz:n.fat_100g,nasycone:n['saturated-fat_100g'],wegle:n.carbohydrates_100g,cukry:n.sugars_100g,blonnik:n.fiber_100g,sol:n.salt_100g,zrodlo:'OFF',
    porcja_g:num(pr.serving_quantity)>0?num(pr.serving_quantity):'',porcja_nazwa:num(pr.serving_quantity)>0?'1 porcja':''}}
async function offSearch(term,box,cb){
  box.innerHTML='<p class="muted c">Szukam w Open Food Facts…</p>';
  try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=25&lc=pl&cc=pl&fields=code,product_name,product_name_pl,brands,nutriments,serving_quantity`);
    const j=await r.json();
    const ps=(j.products||[]).filter(p=>(p.product_name_pl||p.product_name)&&p.nutriments&&(p.nutriments['energy-kcal_100g']!=null||p.nutriments['energy_100g']!=null));
    if(!ps.length){box.innerHTML='<p class="muted c">Nic nie znaleziono. Dodaj nowy produkt ręcznie.</p>';return}
    box.innerHTML='<div class="lbl">Open Food Facts</div>'+ps.map((p,i)=>{const pre=offToPre(p);return `<button class="item" data-o="${i}"><span class="nm"><b>${esc(pre.nazwa)}</b><small>${esc(pre.marka||'—')}</small></span><span class="k">${Math.round(num(pre.kcal))} kcal/100 g</span></button>`}).join('');
    box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>productForm(offToPre(ps[+b.dataset.o]),cb))}
  catch{box.innerHTML='<p class="muted c">Nie udało się połączyć z Open Food Facts. Spróbuj za chwilę.</p>'}}
async function handleCode(code,cb){
  const p=db.produkty.find(x=>String(x.kod)===code);
  if(p)return cb(asItem(p,'produkt'));
  toast('Szukam w Open Food Facts…');
  let pre={kod:code};
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_pl,brands,nutriments,serving_quantity`);
    const j=await r.json();
    if(j.status===1&&j.product){pre=offToPre(j.product,code);
      toast('Znaleziono – sprawdź dane z etykietą')}
    else toast('Brak w bazie – przepisz wartości z etykiety')}
  catch{toast('Nie udało się połączyć z bazą – wpisz ręcznie')}

  const upd=()=>{const m=calc(base,st.g);$(ov,'#mb').innerHTML=macHTML(m);$(ov,'#mb2').textContent=extraTxt(m);$(ov,'#ph').textContent=(tareOf(twSel)?`netto ${r1(st.g)} g · `:'')+(unit&&st.g>0?`= ${r1(st.g/unit.g)} × ${unit.n}`:'')};
  const ep=$(ov,'#ep');if(ep)ep.onclick=()=>{ov.close();ensureProduct(item);
    productForm(prodIdx.get(String(item.id)),np=>entryForm(asItem(np,'produkt'),{entry,pora:st.pora}),{edit:true})};
  const setPora=p=>{st.pora=p;ov.querySelectorAll('#pr .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===p))};
  gi.oninput=()=>{st.g=netG();upd()};
  if(dish){$(ov,'#dc').onclick=()=>{ov.close();cookedSheet(dish,()=>entryForm(findItem('danie',dish.id),{entry,pora:st.pora,grupa}))};
    $(ov,'#dr').onclick=()=>{ov.close();dishForm(nd=>entryForm(nd,{pora:st.pora,grupa}),{from:dish})};
    $(ov,'#dz').onclick=()=>{ov.close();saveDish({...dish,status:dish.status==='zjedzone'?'':'zjedzone'});toast(dish.status==='zjedzone'?'Przywrócono':'Oznaczono jako zjedzone')}}
  ov.querySelectorAll('#qk .chip').forEach(b=>b.onclick=()=>{st.g=+b.dataset.g;gi.value=st.g;if(twSel)twSel.value='';upd()});
  ov.querySelectorAll('#pr .chip').forEach(b=>b.onclick=()=>{poraTouched=true;setPora(b.dataset.p)});
  $(ov,'#t').onchange=e=>{st.godz=e.target.value;if(!poraTouched&&st.godz)setPora(guessPora(st.godz))};
  $(ov,'#d').onchange=e=>{st.data=e.target.value};
  $(ov,'#ok').onclick=()=>{
    if(st.g<=0)return toast('Podaj ilość');if(!st.data||!st.godz)return toast('Podaj datę i godzinę');
    const m=calc(base,st.g);
    const e={id:edit?entry.id:uid(),data:st.data,godzina:st.godz,pora:st.pora,typ,ref_id:String(edit?entry.ref_id:item.id),nazwa,ilosc_g:r1(st.g),
      dodano:edit?entry.dodano:isoNow(),zmieniono:edit?isoNow():'',mikro_zrodlo:m._mz||'',
      grupa_id:edit?(entry.grupa_id||''):(grupa?grupa.id:''),grupa_szt:edit?(entry.grupa_szt??''):(grupa?grupa.szt??'':''),
      danie_nazwa:edit?(entry.grupa_id?`${baseName(entry.danie_nazwa)} (${dSuffix(st.data)})`:''):(grupa?`${grupa.base} (${dSuffix(st.data)})`:'')};
    ALLK.forEach(k=>e[k]=m[k]==null?'':m[k]);
    upsertLocal(e);enqueue(edit?'updateEntry':'addEntry',e);if(!edit)pushRecent(typ,e.ref_id);
    ov.close();toast(edit?'Zapisano':'Dodano');
    if(e.data!==curDate){curDate=e.data;loadDay()}else renderDay()};
  if(edit)$(ov,'#del').onclick=()=>{if(!confirm('Usunąć ten wpis?'))return;deleteLocal(entry.id);enqueue('deleteEntry',{id:entry.id});ov.close();renderDay();toast('Usunięto')};
  upd()}

/* ---------- ustawienia ---------- */
function openSettings(first){
  const ov=sheet('Ustawienia',`
    ${first?'<p class="muted">Wklej adres wdrożonego skryptu i token z pliku Code.gs.</p>':''}
    <label>Adres aplikacji (Apps Script)<input id="u" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>Token<input id="tk" value="${esc(cfg.token)}" autocomplete="off"></label>
    <button class="btn primary big" id="ok">Zapisz i połącz</button>
    <div class="lbl">Naczynia (tara)</div><div id="nl"></div>
    <div class="row2"><input id="nn" placeholder="np. Garnek duży"><input id="ng" inputmode="decimal" placeholder="waga g" style="max-width:110px"><button class="btn" id="na">Dodaj</button></div>
    <p class="muted" id="st">${queue.length?`Oczekuje na wysłanie: ${queue.length}${lastErr?' ('+esc(lastErr)+')':''}`:''}</p>`);
  const nl=()=>{$(ov,'#nl').innerHTML=naczynia.length?naczynia.map((n,i)=>`<div class="skrow"><span class="nm">${esc(n.nazwa)}</span><span class="muted">${Math.round(n.g)} g</span><button class="icon" data-nd="${i}" aria-label="Usuń">✕</button></div>`).join(''):'<p class="muted">Brak. Dodaj garnki, blachy, talerze – przy ważeniu wybierzesz naczynie, a aplikacja odejmie jego wagę.</p>';
    ov.querySelectorAll('[data-nd]').forEach(b=>b.onclick=()=>{naczynia.splice(+b.dataset.nd,1);LS.set('naczynia',naczynia);nl()})};nl();
  $(ov,'#na').onclick=()=>{const n=$(ov,'#nn').value.trim(),g=num($(ov,'#ng').value);if(!n||!(g>0))return toast('Podaj nazwę i wagę');
    naczynia.push({nazwa:n,g});LS.set('naczynia',naczynia);$(ov,'#nn').value='';$(ov,'#ng').value='';nl()};
  $(ov,'#ok').onclick=async()=>{
    cfg={url:$(ov,'#u').value.trim(),token:$(ov,'#tk').value.trim()};LS.set('cfg',cfg);
    const st=$(ov,'#st');st.textContent='Łączę…';
    try{await refreshDb();st.textContent='Połączono ✓';flush();loadDay();setTimeout(ov.close,700)}
    catch(e){st.textContent='Błąd: '+e.message}}}

/* ---------- start ---------- */
$$('#prev').onclick=()=>{curDate=addDays(curDate,-1);loadDay()};
$$('#next').onclick=()=>{curDate=addDays(curDate,1);loadDay()};
$$('#dateInp').onchange=e=>{if(e.target.value){curDate=e.target.value;loadDay()}};
$$('#fab').onclick=()=>openAdd(null);
$$('#set').onclick=()=>openSettings(false);
$$('#sync').onclick=()=>{if(queue.length){toast(lastErr?`Czeka ${queue.length}: ${lastErr}`:'Wysyłam…');flush()}else toast('Wszystko zapisane na Dysku')};
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush();loadDay()}});
let sx=0,sy=0;const mainEl=$$('#main');
mainEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
mainEl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)){curDate=addDays(curDate,dx<0?1:-1);loadDay()}},{passive:true});

setSync();renderDay();
if(!cfg.url||!cfg.token)openSettings(true);
else{refreshDb().then(()=>renderDay()).catch(()=>{});loadDay();flush()}
</script>
