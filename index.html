button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;align-items:center;gap:4px}
.icon{background:none;border:0;width:40px;height:40px;border-radius:12px;font-size:22px;display:grid;place-items:center;flex:none}
.icon:active{background:var(--line)}
#dateBox{flex:1;text-align:center;position:relative;min-width:0}
#dateLbl{font-size:18px;font-weight:700}

#sync{font-size:12px;padding:5px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);border:0;flex:none}

main{padding:0 16px calc(110px + env(safe-area-inset-bottom))}

.kcal small{font-size:14px;font-weight:500;color:var(--mut)}
.mac{display:flex;gap:14px;font-size:12px;color:var(--mut);text-align:center}
.mac b{display:block;font-size:16px}
.cB{color:var(--b)}.cT{color:var(--t)}.cW{color:var(--w)}

.mac-s{padding:0 16px 10px;font-size:12px;color:var(--mut)}

.btn:disabled{opacity:.45}
.hint{text-align:center;color:var(--mut);font-size:14px;margin-top:6px;min-height:20px}
.add-s{color:var(--acc);font-size:26px}

.entry:active{background:var(--acc2)}
.entry{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mut);font-size:13px}
.entry .k{font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:34px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}

.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}

const GEN=GENERIC.map(([n,k,b,t,w,c,f])=>({id:'g-'+norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),kod:'',nazwa:n,marka:'',kcal:k,bialko:b,tluszcz:t,nasycone:'',wegle:w,cukry:c,blonnik:f,sol:'',zrodlo:'baza ogólna',porcja_g:PORCJE[n]?PORCJE[n][0]:'',porcja_nazwa:PORCJE[n]?PORCJE[n][1]:''}));

const PORY=['Śniadanie','II śniadanie','Obiad','Podwieczorek','Kolacja','Przekąska'];
function guessPora(hm){const [h,m]=hm.split(':').map(Number);const t=h+m/60;
  if(t<4)return 'Przekąska';if(t<10)return 'Śniadanie';if(t<12)return 'II śniadanie';if(t<15.5)return 'Obiad';if(t<17.5)return 'Podwieczorek';if(t<21.5)return 'Kolacja';return 'Przekąska'}

/* ---------- stan ---------- */
let cfg=LS.get('cfg',{url:'',token:''});
let db=LS.get('db',{produkty:[],dania:[],skladniki:[]});
let queue=LS.get('queue',[]);
let dayCache=LS.get('days',{});
let recent=LS.get('recent',[]);
let collapsed=LS.get('collapsed',{});
const isCollapsed=p=>collapsed[p]!==false;
let curDate=today(), lastErr='';
let prodIdx=new Map();
function saveDb(){prodIdx=new Map(db.produkty.map(p=>[String(p.id),p]));LS.set('db',db)}
saveDb();
function saveDays(){const lim=addDays(today(),-60);for(const d in dayCache)if(d<lim)delete dayCache[d];LS.set('days',dayCache)}

/* ---------- wartości odżywcze ---------- */
const asItem=(o,typ)=>({...o,typ});
function findItem(typ,id){if(typ==='danie'){const d=db.dania.find(x=>String(x.id)===String(id));return d?asItem(d,'danie'):null}const p=prodIdx.get(String(id));return p?asItem(p,'produkt'):null}
function dishWeight(d){return db.skladniki.filter(s=>s.danie_id===d.id).reduce((a,s)=>a+num(s.gramy),0)}
function per100(it){
  if(it.typ==='danie'){let W=0;const t={kcal:0,b:0,t:0,w:0};
    db.skladniki.filter(s=>s.danie_id===it.id).forEach(s=>{const g=num(s.gramy);W+=g;const p=prodIdx.get(String(s.produkt_id));if(!p)return;const q=per100(asItem(p,'produkt'));for(const k in t)t[k]+=q[k]*g/100});
    if(!W)return{kcal:0,b:0,t:0,w:0};for(const k in t)t[k]=t[k]*100/W;return t}
  return{kcal:num(it.kcal),b:num(it.bialko),t:num(it.tluszcz),w:num(it.wegle)}}
const calc=(p,g)=>({kcal:Math.round(p.kcal*g/100),b:r1(p.b*g/100),t:r1(p.t*g/100),w:r1(p.w*g/100)});
const macHTML=m=>`<div><b>${m.kcal}</b>kcal</div><div><b class="cB">${m.b}</b>białko</div><div><b class="cT">${m.t}</b>tłuszcz</div><div><b class="cW">${m.w}</b>węglow.</div>`;

/* ---------- komunikacja z arkuszem ---------- */
async function apiGet(params){const q=new URLSearchParams({...params,token:cfg.token});const r=await fetch(cfg.url+'?'+q);const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function apiPost(action,data){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action,data})});const j=await r.json();if(j.error)throw new Error(j.error);return j}

function setSync(){const b=$$('#sync');b.textContent=queue.length?`⟳ ${queue.length}`:'✓';b.classList.toggle('pending',!!queue.length)}
function enqueue(action,data){queue.push({action,data});LS.set('queue',queue);setSync();flush()}
let flushing=false;
async function flush(){if(flushing||!cfg.url)return;flushing=true;
  try{while(queue.length){try{await apiPost(queue[0].action,queue[0].data);lastErr=''}catch(e){lastErr=e.message;break}queue.shift();LS.set('queue',queue)}}
  finally{flushing=false;setSync()}}

async function refreshDb(){
  const j=await apiGet({action:'init'});
  const P=j.produkty.map(p=>({...p,id:String(p.id),kod:String(p.kod??'')}));
  const D=j.dania.map(d=>({...d,id:String(d.id),porcje:num(d.porcje)||1}));
  const S=j.skladniki.map(s=>({danie_id:String(s.danie_id),produkt_id:String(s.produkt_id),gramy:num(s.gramy)}));
  queue.forEach(op=>{if(op.action==='addProduct'&&!P.some(x=>x.id===op.data.id))P.push(op.data);
    if(op.action==='addDish'&&!D.some(x=>x.id===op.data.danie.id)){D.push(op.data.danie);S.push(...op.data.skladniki)}});
  db={produkty:P,dania:D,skladniki:S};saveDb()}

function applyQueue(list,d){queue.forEach(op=>{const e=op.data;
  if(op.action==='addEntry'||op.action==='updateEntry'){list=list.filter(x=>x.id!==e.id);if(e.data===d)list.push(e)}
  else if(op.action==='deleteEntry')list=list.filter(x=>x.id!==e.id)});return list}

async function loadDay(){renderDay();if(!cfg.url)return;const d=curDate;
  try{const j=await apiGet({action:'day',date:d});
    let list=j.entries.map(e=>({...e,id:String(e.id),godzina:String(e.godzina),ilosc_g:num(e.ilosc_g),kcal:num(e.kcal),bialko:num(e.bialko),tluszcz:num(e.tluszcz),wegle:num(e.wegle)}));
    dayCache[d]=applyQueue(list,d);saveDays();if(d===curDate)renderDay()}catch(e){lastErr=e.message}}
function upsertLocal(e){for(const d in dayCache)dayCache[d]=dayCache[d].filter(x=>x.id!==e.id);(dayCache[e.data]=dayCache[e.data]||[]).push(e);saveDays()}
function deleteLocal(id){for(const d in dayCache)dayCache[d]=dayCache[d].filter(x=>x.id!==id);saveDays()}
function pushRecent(typ,id){recent=recent.filter(r=>!(r.typ===typ&&r.id===id));recent.unshift({typ,id});recent=recent.slice(0,25);LS.set('recent',recent)}

/* ---------- widok dnia ---------- */
function renderDay(){
  const t=today();
  const lbl=curDate===t?'Dziś':curDate===addDays(t,-1)?'Wczoraj':curDate===addDays(t,1)?'Jutro':parseD(curDate).toLocaleDateString('pl-PL',{weekday:'long'});
  $$('#dateLbl').textContent=lbl[0].toUpperCase()+lbl.slice(1);
  $$('#dateSub').textContent=parseD(curDate).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
  $$('#dateInp').value=curDate;
  const list=(dayCache[curDate]||[]).slice().sort((a,b)=>String(a.godzina).localeCompare(String(b.godzina)));
  const sum=es=>es.reduce((a,e)=>({kcal:a.kcal+num(e.kcal),b:a.b+num(e.bialko),t:a.t+num(e.tluszcz),w:a.w+num(e.wegle)}),{kcal:0,b:0,t:0,w:0});
  const T=sum(list);
  $$('#sum').innerHTML=`<div class="sum"><div class="kcal">${Math.round(T.kcal)} <small>kcal</small></div><div class="mac"><div><b class="cB">${r1(T.b)}</b>B</div><div><b class="cT">${r1(T.t)}</b>T</div><div><b class="cW">${r1(T.w)}</b>W</div></div></div>`;
  const pory=[...PORY,...new Set(list.map(e=>e.pora).filter(p=>!PORY.includes(p)))];
  $$('#meals').innerHTML=pory.map(p=>{const es=list.filter(e=>e.pora===p),n=es.length,c=n&&isCollapsed(p),S=sum(es);
    const ts=[...new Set(es.map(e=>String(e.godzina)))].sort(),tm=ts.length>1?ts[0]+'–'+ts[ts.length-1]:(ts[0]||'');
    return `<section class="meal"><div class="meal-h">
      <button class="meal-t" data-tog="${esc(p)}"${n?'':' disabled'}><span class="chev">${n?(c?'▸':'▾'):''}</span><span class="nm"><b>${esc(p)}</b>${n?`<small>${esc(tm)} · ${n} poz. · ${Math.round(S.kcal)} kcal</small>`:''}</span></button>
      ${n?`<button class="icon" data-time="${esc(p)}" aria-label="Godzina posiłku: ${esc(p)}">🕒</button>`:''}
      <button class="icon add-s" data-add="${esc(p)}" aria-label="Dodaj do: ${esc(p)}">+</button></div>
    ${n&&!c?`<div class="mac-s"><span class="cB">B ${r1(S.b)}</span> · <span class="cT">T ${r1(S.t)}</span> · <span class="cW">W ${r1(S.w)}</span></div>`+es.map(e=>`<button class="entry" data-id="${esc(e.id)}"><span class="nm"><b>${esc(e.nazwa)}</b><small>${r1(num(e.ilosc_g))} g · ${esc(e.godzina)}</small></span><span class="k">${Math.round(num(e.kcal))} kcal</span></button>`).join(''):''}</section>`}).join('')
    +(list.length>1?'<button class="btn ghost" id="multi" style="width:100%;margin-top:4px">☑ Zaznacz kilka pozycji</button>':'');
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openAdd(b.dataset.add));
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const p=b.dataset.tog;collapsed[p]=!isCollapsed(p);LS.set('collapsed',collapsed);renderDay()});
  document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{const es=list.filter(e=>e.pora===b.dataset.time);batchSheet(es,es.map(e=>e.id),b.dataset.time+' – godzina')});
  const mb=$$('#multi');if(mb)mb.onclick=()=>batchSheet(list,[],'Zaznacz pozycje');
  document.querySelectorAll('.entry').forEach(b=>{let tmr=null,lp=false;
    const cancel=()=>{clearTimeout(tmr);tmr=null};
    b.addEventListener('touchstart',()=>{lp=false;tmr=setTimeout(()=>{lp=true;if(navigator.vibrate)navigator.vibrate(30);batchSheet(list,[b.dataset.id],'Zaznacz pozycje')},500)},{passive:true});
    b.addEventListener('touchmove',cancel,{passive:true});b.addEventListener('touchend',cancel);b.addEventListener('touchcancel',cancel);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.onclick=()=>{if(lp){lp=false;return}const e=list.find(x=>x.id===b.dataset.id);if(e)entryForm(findItem(e.typ,e.ref_id),{entry:e})}});
}

/* ---------- zbiorcza zmiana godziny / pory ---------- */
function batchSheet(entries,checked,title){
  if(!entries.length)return;
  const sel=new Set(checked.map(String));
  const ord=e=>{const i=PORY.indexOf(e.pora);return i<0?99:i};
  const ents=entries.slice().sort((a,b)=>ord(a)-ord(b)||String(a.godzina).localeCompare(String(b.godzina)));
  const groups=[...new Set(ents.map(e=>e.pora))];
  const ov=sheet(title,`
    <div class="row2" style="margin-bottom:8px"><button class="btn ghost" id="all">Zaznacz wszystkie</button><button class="btn ghost" id="none">Odznacz</button></div>
    ${groups.map(g=>(groups.length>1?`<div class="lbl">${esc(g)}</div>`:'')+ents.filter(e=>e.pora===g).map(e=>`<label class="ck"><input type="checkbox" data-id="${esc(e.id)}"${sel.has(e.id)?' checked':''}><span class="nm"><b>${esc(e.nazwa)}</b><small>${r1(num(e.ilosc_g))} g · ${esc(e.godzina)}</small></span></label>`).join('')).join('')}
    <label>Godzina spożycia<input type="time" id="bt"></label>
    <div class="lbl">Pora posiłku</div>
    <div class="chips" id="bp">${PORY.map(p=>`<button class="chip" data-p="${esc(p)}">${p}</button>`).join('')}</div>
    <button class="btn primary big" id="ok"></button>
    <button class="btn ghost big danger" id="del"></button>`,{full:ents.length>4});
  const bt=$(ov,'#bt');let pora=null,tT=false,pT=false;
  const chosen=()=>ents.filter(e=>sel.has(e.id));
  const setPora=p=>{pora=p;ov.querySelectorAll('#bp .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===p))};
  function sync(){const s=chosen(),ts=[...new Set(s.map(e=>String(e.godzina)))],ps=[...new Set(s.map(e=>e.pora))];
    if(!tT)bt.value=ts.length===1?ts[0]:'';
    if(!pT)setPora(ps.length===1?ps[0]:null);
    const ok=$(ov,'#ok'),del=$(ov,'#del');
    ok.textContent=`Zastosuj do zaznaczonych (${s.length})`;ok.disabled=!s.length;
    del.textContent=`Usuń zaznaczone (${s.length})`;del.disabled=!s.length}
  const boxes=()=>ov.querySelectorAll('input[type=checkbox]');
  boxes().forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);sync()});
  $(ov,'#all').onclick=()=>{boxes().forEach(c=>{c.checked=true;sel.add(c.dataset.id)});sync()};
  $(ov,'#none').onclick=()=>{boxes().forEach(c=>{c.checked=false});sel.clear();sync()};
  bt.oninput=bt.onchange=()=>{tT=true};
  ov.querySelectorAll('#bp .chip').forEach(b=>b.onclick=()=>{pT=true;setPora(b.dataset.p)});
  $(ov,'#ok').onclick=()=>{const s=chosen();if(!s.length)return;const t=bt.value;let n=0;
    s.forEach(e=>{const u={...e};if(t)u.godzina=t;if(pora)u.pora=pora;if(u.godzina===e.godzina&&u.pora===e.pora)return;
      u.zmieniono=isoNow();upsertLocal(u);enqueue('updateEntry',u);n++});
    ov.close();renderDay();toast(n?`Zmieniono: ${n}`:'Bez zmian')};
  $(ov,'#del').onclick=()=>{const s=chosen();if(!s.length||!confirm(`Usunąć zaznaczone pozycje (${s.length})?`))return;
    s.forEach(e=>{deleteLocal(e.id);enqueue('deleteEntry',{id:e.id})});ov.close();renderDay();toast('Usunięto')};
  sync()}

/* ---------- arkusze (okna) ---------- */
function sheet(title,body,{full=false}={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet${full?' full':''}"><div class="sh-head"><button class="icon" data-close aria-label="Zamknij">✕</button><h2>${esc(title)}</h2><span></span></div><div class="sh-body">${body}</div></div>`;
  ov.close=()=>{if(ov._closed)return;ov._closed=true;ov.classList.remove('open');setTimeout(()=>ov.remove(),200);ov.onclose&&ov.onclose()};
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))ov.close()});
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('open'));return ov}

/* ---------- wybór produktu / dania ---------- */
function openAdd(pora){openPicker({mode:'entry',onPick:it=>entryForm(it,{pora})})}
function openPicker({mode,onPick}){
  const ov=sheet(mode==='entry'?'Dodaj do dziennika':'Dodaj składnik',`
    <div class="search"><input id="q" placeholder="Szukaj${mode==='entry'?' produktu lub dania':' produktu'}…" autocomplete="off"><button class="btn" id="scan">▥ Skanuj</button></div>
    <div id="list"></div>
    <div class="row2" style="margin-top:12px"><button class="btn ghost" id="newP">+ Nowy produkt</button>${mode==='entry'?'<button class="btn ghost" id="newD">+ Nowe danie</button>':''}</div>`,{full:true});
  const q=$(ov,'#q'),list=$(ov,'#list');
  const pick=it=>{ensureProduct(it);ov.close();onPick(it)};
  const pool=()=>[...db.produkty.map(p=>asItem(p,'produkt')),...GEN.filter(g=>!prodIdx.has(g.id)).map(g=>asItem(g,'produkt')),...(mode==='entry'?db.dania.map(d=>asItem(d,'danie')):[])];
  const sub=it=>{const b=it.typ==='danie'?'Danie':it.zrodlo==='baza ogólna'?'Baza ogólna':esc(it.marka||'Mój produkt');
    return it.typ!=='danie'&&num(it.porcja_g)>0?`${b} · ${esc(it.porcja_nazwa||'porcja')} = ${r1(num(it.porcja_g))} g`:b};
  function render(){const s=norm(q.value).trim();let items,head='';
    if(!s){items=recent.map(r=>findItem(r.typ,r.id)).filter(it=>it&&(mode==='entry'||it.typ==='produkt'));
      head=items.length?'<div class="lbl">Ostatnio używane</div>':'<p class="muted">Zacznij pisać albo zeskanuj kod kreskowy.</p>'}
    else{const w=s.split(/\s+/);items=pool().filter(it=>{const h=norm(it.nazwa+' '+(it.marka||''));return w.every(x=>h.includes(x))})
      .sort((a,b)=>(norm(b.nazwa).startsWith(w[0])-norm(a.nazwa).startsWith(w[0]))||((a.zrodlo==='baza ogólna')-(b.zrodlo==='baza ogólna'))||a.nazwa.localeCompare(b.nazwa,'pl'));
      head=items.length?'':'<p class="muted">Brak w twojej bazie i bazie ogólnej.</p>'}
    items=items.slice(0,40);
    list.innerHTML=head+items.map((it,i)=>`<button class="item" data-i="${i}"><span class="nm"><b>${esc(it.nazwa)}</b><small>${sub(it)}</small></span><span class="k">${Math.round(per100(it).kcal)} kcal/100 g</span></button>`).join('')
      +(s?`<button class="btn ghost" id="offBtn" style="width:100%;margin-top:6px">🔎 Szukaj „${esc(q.value.trim())}” w Open Food Facts</button><div id="offRes"></div>`:'');
    list.querySelectorAll('.item').forEach(b=>b.onclick=()=>pick(items[+b.dataset.i]));
    const ob=$(list,'#offBtn');if(ob)ob.onclick=()=>offSearch(q.value.trim(),$(list,'#offRes'),pick)}
  q.oninput=render;render();
  $(ov,'#scan').onclick=()=>openScanner(code=>handleCode(code,pick));
  $(ov,'#newP').onclick=()=>productForm({nazwa:q.value.trim()},pick);
  if(mode==='entry')$(ov,'#newD').onclick=()=>dishForm(pick);
}

/* ---------- skaner ---------- */
function openScanner(onCode){
  const ov=sheet('Skanuj kod',`<div id="reader"></div><p class="muted c" id="hint" style="display:flex">Nakieruj aparat na kod kreskowy</p>
    <div class="search"><input id="man" inputmode="numeric" placeholder="lub wpisz kod ręcznie"><button class="btn" id="manOk">OK</button></div>`,{full:true});
  let sc=null,done=false;
  const stop=async()=>{try{if(sc&&sc.isScanning)await sc.stop()}catch{}};
  ov.onclose=stop;
  const finish=code=>{if(done||!code)return;done=true;if(navigator.vibrate)navigator.vibrate(60);ov.close();onCode(code)};
  $(ov,'#manOk').onclick=()=>finish($(ov,'#man').value.replace(/\D/g,''));
  if(typeof Html5Qrcode==='undefined'){$(ov,'#reader').innerHTML='<p class="muted c" style="color:#ccc;padding:40px 16px">Skaner niedostępny – wpisz kod ręcznie.</p>';return}
  const F=Html5QrcodeSupportedFormats;
  sc=new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  sc.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.85,320)),height:Math.floor(Math.min(h*.45,150))})},t=>finish(String(t).trim()),()=>{})
    .catch(()=>{$(ov,'#reader').innerHTML='<p class="muted c" style="color:#ccc;padding:40px 16px">Brak dostępu do aparatu – zezwól w przeglądarce albo wpisz kod ręcznie.</p>'});
}
function ensureProduct(it){
  if(it&&it.typ==='produkt'&&!prodIdx.has(String(it.id))){const p={...it};delete p.typ;p.dodano=isoNow();db.produkty.push(p);saveDb();enqueue('addProduct',p)}
  return it}
function offToPre(pr,code){const n=pr.nutriments||{};
  let kcal=n['energy-kcal_100g'];if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;
  return{kod:code||pr.code||'',nazwa:pr.product_name_pl||pr.product_name||'',marka:(pr.brands||'').split(',')[0].trim(),
    kcal,bialko:n.proteins_100g,tluszcz:n.fat_100g,nasycone:n['saturated-fat_100g'],wegle:n.carbohydrates_100g,cukry:n.sugars_100g,blonnik:n.fiber_100g,sol:n.salt_100g,zrodlo:'OFF',
    porcja_g:num(pr.serving_quantity)>0?num(pr.serving_quantity):'',porcja_nazwa:num(pr.serving_quantity)>0?'1 porcja':''}}
async function offSearch(term,box,cb){
  box.innerHTML='<p class="muted c">Szukam w Open Food Facts…</p>';
  try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=25&lc=pl&cc=pl&fields=code,product_name,product_name_pl,brands,nutriments,serving_quantity`);
    const j=await r.json();
    const ps=(j.products||[]).filter(p=>(p.product_name_pl||p.product_name)&&p.nutriments&&(p.nutriments['energy-kcal_100g']!=null||p.nutriments['energy_100g']!=null));
    if(!ps.length){box.innerHTML='<p class="muted c">Nic nie znaleziono. Dodaj nowy produkt ręcznie.</p>';return}
    box.innerHTML='<div class="lbl">Open Food Facts</div>'+ps.map((p,i)=>{const pre=offToPre(p);return `<button class="item" data-o="${i}"><span class="nm"><b>${esc(pre.nazwa)}</b><small>${esc(pre.marka||'—')}</small></span><span class="k">${Math.round(num(pre.kcal))} kcal/100 g</span></button>`}).join('');
    box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>productForm(offToPre(ps[+b.dataset.o]),cb))}
  catch{box.innerHTML='<p class="muted c">Nie udało się połączyć z Open Food Facts. Spróbuj za chwilę.</p>'}}
async function handleCode(code,cb){
  const p=db.produkty.find(x=>String(x.kod)===code);
  if(p)return cb(asItem(p,'produkt'));
  toast('Szukam w Open Food Facts…');
  let pre={kod:code};
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_pl,brands,nutriments,serving_quantity`);
    const j=await r.json();
    if(j.status===1&&j.product){pre=offToPre(j.product,code);
      toast('Znaleziono – sprawdź dane z etykietą')}
    else toast('Brak w bazie – przepisz wartości z etykiety')}
  catch{toast('Nie udało się połączyć z bazą – wpisz ręcznie')}
  productForm(pre,cb)}

/* ---------- nowy produkt ---------- */
function productForm(pre,cb,{edit=false}={}){
  const F=[['kcal','Kalorie (kcal) *'],['bialko','Białko (g)'],['tluszcz','Tłuszcz (g)'],['nasycone','w tym nasycone (g)'],['wegle','Węglowodany (g)'],['cukry','w tym cukry (g)'],['blonnik','Błonnik (g)'],['sol','Sól (g)']];
  const v=k=>pre[k]==null||pre[k]===''?'':r1(num(pre[k]));
  const ov=sheet(edit?'Edytuj produkt':'Nowy produkt',`
    ${pre.zrodlo==='OFF'&&!edit?'<p class="muted">Dane z Open Food Facts – porównaj z etykietą.</p>':''}
    <label>Nazwa *<input id="nazwa" value="${esc(pre.nazwa||'')}" placeholder="np. Skyr naturalny"></label>
    <div class="grid2"><label>Marka<input id="marka" value="${esc(pre.marka||'')}"></label><label>Kod kreskowy<input id="kod" inputmode="numeric" value="${esc(pre.kod||'')}"></label></div>
    <div class="lbl">Porcja (opcjonalnie)</div>
    <div class="grid2"><label>Nazwa porcji<input id="pn" value="${esc(pre.porcja_nazwa||'')}" placeholder="np. 1 bułka"></label><label>Waga porcji (g)<input id="pg" inputmode="decimal" value="${v('porcja_g')}" placeholder="np. 80"></label></div>
    <div class="lbl">Wartości w 100 g</div>
    <div class="grid2">${F.map(([k,l])=>`<label>${l}<input id="f_${k}" inputmode="decimal" value="${v(k)}"></label>`).join('')}</div>
    <button class="btn primary big" id="ok">${edit?'Zapisz zmiany':'Zapisz produkt'}</button>`,{full:true});
  $(ov,'#ok').onclick=()=>{
    const nazwa=$(ov,'#nazwa').value.trim();if(!nazwa)return toast('Podaj nazwę');
    if($(ov,'#f_kcal').value.trim()==='')return toast('Podaj kalorie');
    const p=edit?{...pre}:{id:uid(),zrodlo:pre.zrodlo||'etykieta',dodano:isoNow()};delete p.typ;
    Object.assign(p,{kod:$(ov,'#kod').value.trim(),nazwa,marka:$(ov,'#marka').value.trim()});
    F.forEach(([k])=>{const x=$(ov,'#f_'+k).value.trim();p[k]=x===''?'':num(x)});
    const pg=num($(ov,'#pg').value);p.porcja_g=pg>0?r1(pg):'';p.porcja_nazwa=pg>0?($(ov,'#pn').value.trim()||'1 porcja'):'';
    const i=db.produkty.findIndex(x=>String(x.id)===String(p.id));if(i>=0)db.produkty[i]=p;else db.produkty.push(p);
    saveDb();enqueue('addProduct',p);ov.close();toast(edit?'Produkt zaktualizowany':'Produkt zapisany');cb&&cb(asItem(p,'produkt'))}
}

/* ---------- nowe danie ---------- */
function dishForm(cb){
  const st={sk:[]};
  const ov=sheet('Nowe danie',`
    <label>Nazwa dania *<input id="n" placeholder="np. Owsianka z bananem"></label>
    <label>Na ile porcji?<input id="p" inputmode="decimal" value="1"></label>
    <div class="lbl">Składniki</div><div id="sk"></div>
    <button class="btn ghost" id="add" style="width:100%">+ Dodaj składnik</button>
    <div id="sum"></div>
    <button class="btn primary big" id="ok">Zapisz danie</button>`,{full:true});
  const pIn=$(ov,'#p');
  function upd(){let W=0;const t={kcal:0,b:0,t:0,w:0};
    st.sk.forEach(s=>{const p=prodIdx.get(s.produkt_id);W+=s.gramy;if(!p)return;const m=calc(per100(asItem(p,'produkt')),s.gramy);for(const k in t)t[k]+=m[k]});
    const n=num(pIn.value)||1,por={kcal:Math.round(t.kcal/n),b:r1(t.b/n),t:r1(t.t/n),w:r1(t.w/n)};
    $(ov,'#sum').innerHTML=st.sk.length?`<div class="lbl">Jedna porcja · ${Math.round(W/n)} g</div><div class="macbox" style="margin-top:0">${macHTML(por)}</div>`:''}
  function render(){
    $(ov,'#sk').innerHTML=st.sk.length?st.sk.map((s,i)=>{const p=prodIdx.get(s.produkt_id);return `<div class="skrow"><span class="nm">${esc(p?p.nazwa:'?')}</span><input inputmode="decimal" data-i="${i}" value="${s.gramy}"><span class="muted">g</span><button class="icon" data-rm="${i}" aria-label="Usuń">✕</button></div>`}).join(''):'<p class="muted">Dodaj składniki z gramaturą.</p>';
    ov.querySelectorAll('#sk input').forEach(x=>x.oninput=()=>{st.sk[+x.dataset.i].gramy=num(x.value);upd()});
    ov.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{st.sk.splice(+b.dataset.rm,1);render()});
    upd()}
  pIn.oninput=upd;
  $(ov,'#add').onclick=()=>openPicker({mode:'ingredient',onPick:it=>{st.sk.push({produkt_id:String(it.id),gramy:100});render();
    const ins=ov.querySelectorAll('#sk input');const last=ins[ins.length-1];if(last){last.focus();last.select()}}});
  $(ov,'#ok').onclick=()=>{
    const nazwa=$(ov,'#n').value.trim();if(!nazwa)return toast('Podaj nazwę dania');
    if(!st.sk.length)return toast('Dodaj co najmniej jeden składnik');
    const d={id:uid(),nazwa,porcje:num(pIn.value)||1,waga_g:r1(st.sk.reduce((a,s)=>a+s.gramy,0)),dodano:isoNow()};
    const sk=st.sk.map(s=>({danie_id:d.id,produkt_id:s.produkt_id,gramy:s.gramy}));
    db.dania.push(d);db.skladniki.push(...sk);saveDb();enqueue('addDish',{danie:d,skladniki:sk});
    ov.close();toast('Danie zapisane');cb&&cb(asItem(d,'danie'))};
  render()}

/* ---------- wpis do dziennika (dodawanie i edycja) ---------- */
function entryForm(item,{entry=null,pora=null}={}){
  const edit=!!entry;
  const zero={kcal:0,b:0,t:0,w:0};
  const base=edit&&num(entry.ilosc_g)>0
    ?{kcal:num(entry.kcal)*100/num(entry.ilosc_g),b:num(entry.bialko)*100/num(entry.ilosc_g),t:num(entry.tluszcz)*100/num(entry.ilosc_g),w:num(entry.wegle)*100/num(entry.ilosc_g)}
    :(item?per100(item):zero);
  const typ=edit?entry.typ:item.typ,nazwa=edit?entry.nazwa:item.nazwa;
  const dish=typ==='danie'&&item?item:null;
  const porcja=dish?dishWeight(dish)/(num(dish.porcje)||1):0;
  const unit=typ==='produkt'&&item&&num(item.porcja_g)>0?{g:num(item.porcja_g),n:item.porcja_nazwa||'1 porcja'}:null;
  const hm=nowHM();
  const mealT=!edit&&pora?(dayCache[curDate]||[]).filter(x=>x.pora===pora).map(x=>String(x.godzina)).sort().pop():null;
  const st={g:edit?num(entry.ilosc_g):(porcja?Math.round(porcja):unit?unit.g:100),pora:edit?entry.pora:(pora||guessPora(hm)),data:edit?entry.data:curDate,godz:edit?entry.godzina:(mealT||hm)};
  let poraTouched=edit||!!pora;
  const quick=porcja?[[.5,'½ porcji'],[1,'1 porcja'],[1.5,'1½ porcji'],[2,'2 porcje']].map(([f,l])=>[Math.round(porcja*f),l])
    :unit?[[unit.g,esc(unit.n)],[r1(unit.g*2),'×2'],[r1(unit.g*3),'×3'],[100,'100 g']]
    :[[50,'50 g'],[100,'100 g'],[150,'150 g'],[200,'200 g']];
  const ov=sheet(edit?'Edytuj wpis':'Dodaj',`
    <div class="hero"><b>${esc(nazwa)}</b><small>${typ==='danie'?'Danie'+(porcja?` · porcja ${Math.round(porcja)} g`:''):(unit?`Produkt · ${esc(unit.n)} = ${r1(unit.g)} g`:'Produkt')}</small>
      ${typ==='produkt'&&item?'<br><button class="btn ghost" id="ep" style="font-size:13px;padding:6px 12px;margin-top:6px">✎ Edytuj produkt / porcję</button>':''}</div>
    <div class="amount"><input id="g" inputmode="decimal" value="${r1(st.g)}" aria-label="Ilość w gramach"><span>g</span></div>
    <div class="hint" id="ph"></div>
    <div class="chips c" id="qk" style="margin-top:12px">${quick.map(([g,l])=>`<button class="chip" data-g="${g}">${l}</button>`).join('')}</div>
    <div class="macbox" id="mb"></div>
    <div class="lbl">Pora posiłku</div>
    <div class="chips" id="pr">${PORY.map(p=>`<button class="chip${p===st.pora?' on':''}" data-p="${esc(p)}">${p}</button>`).join('')}</div>
    <div class="row2"><label>Data<input type="date" id="d" value="${st.data}"></label><label>Godzina posiłku<input type="time" id="t" value="${esc(st.godz)}"></label></div>
    <button class="btn primary big" id="ok">${edit?'Zapisz zmiany':'Dodaj do dziennika'}</button>
    ${edit?'<button class="btn ghost big danger" id="del">Usuń wpis</button>':''}`);
  const gi=$(ov,'#g');
  const upd=()=>{$(ov,'#mb').innerHTML=macHTML(calc(base,st.g));$(ov,'#ph').textContent=unit&&st.g>0?`= ${r1(st.g/unit.g)} × ${unit.n}`:''};
  const ep=$(ov,'#ep');if(ep)ep.onclick=()=>{ov.close();ensureProduct(item);
    productForm(prodIdx.get(String(item.id)),np=>entryForm(asItem(np,'produkt'),{entry,pora:st.pora}),{edit:true})};
  const setPora=p=>{st.pora=p;ov.querySelectorAll('#pr .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===p))};
  gi.oninput=()=>{st.g=num(gi.value);upd()};
  ov.querySelectorAll('#qk .chip').forEach(b=>b.onclick=()=>{st.g=+b.dataset.g;gi.value=st.g;upd()});
  ov.querySelectorAll('#pr .chip').forEach(b=>b.onclick=()=>{poraTouched=true;setPora(b.dataset.p)});
  $(ov,'#t').onchange=e=>{st.godz=e.target.value;if(!poraTouched&&st.godz)setPora(guessPora(st.godz))};
  $(ov,'#d').onchange=e=>{st.data=e.target.value};
  $(ov,'#ok').onclick=()=>{
    if(st.g<=0)return toast('Podaj ilość');if(!st.data||!st.godz)return toast('Podaj datę i godzinę');
    const m=calc(base,st.g);
    const e={id:edit?entry.id:uid(),data:st.data,godzina:st.godz,pora:st.pora,typ,ref_id:String(edit?entry.ref_id:item.id),nazwa,ilosc_g:r1(st.g),
      kcal:m.kcal,bialko:m.b,tluszcz:m.t,wegle:m.w,dodano:edit?entry.dodano:isoNow(),zmieniono:edit?isoNow():''};
    upsertLocal(e);enqueue(edit?'updateEntry':'addEntry',e);if(!edit)pushRecent(typ,e.ref_id);
    ov.close();toast(edit?'Zapisano':'Dodano');
    if(e.data!==curDate){curDate=e.data;loadDay()}else renderDay()};
  if(edit)$(ov,'#del').onclick=()=>{if(!confirm('Usunąć ten wpis?'))return;deleteLocal(entry.id);enqueue('deleteEntry',{id:entry.id});ov.close();renderDay();toast('Usunięto')};
  upd()}

/* ---------- ustawienia ---------- */
function openSettings(first){
  const ov=sheet('Ustawienia',`
    ${first?'<p class="muted">Wklej adres wdrożonego skryptu i token z pliku Code.gs.</p>':''}
    <label>Adres aplikacji (Apps Script)<input id="u" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>Token<input id="tk" value="${esc(cfg.token)}" autocomplete="off"></label>
    <button class="btn primary big" id="ok">Zapisz i połącz</button>
    <p class="muted" id="st">${queue.length?`Oczekuje na wysłanie: ${queue.length}${lastErr?' ('+esc(lastErr)+')':''}`:''}</p>`);
  $(ov,'#ok').onclick=async()=>{
    cfg={url:$(ov,'#u').value.trim(),token:$(ov,'#tk').value.trim()};LS.set('cfg',cfg);
    const st=$(ov,'#st');st.textContent='Łączę…';
    try{await refreshDb();st.textContent='Połączono ✓';flush();loadDay();setTimeout(ov.close,700)}
    catch(e){st.textContent='Błąd: '+e.message}}}

/* ---------- start ---------- */
$$('#prev').onclick=()=>{curDate=addDays(curDate,-1);loadDay()};
$$('#next').onclick=()=>{curDate=addDays(curDate,1);loadDay()};
$$('#dateInp').onchange=e=>{if(e.target.value){curDate=e.target.value;loadDay()}};
$$('#fab').onclick=()=>openAdd(null);
$$('#set').onclick=()=>openSettings(false);
$$('#sync').onclick=()=>{if(queue.length){toast(lastErr?`Czeka ${queue.length}: ${lastErr}`:'Wysyłam…');flush()}else toast('Wszystko zapisane na Dysku')};
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush();loadDay()}});
let sx=0,sy=0;const mainEl=$$('#main');
mainEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
mainEl.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)){curDate=addDays(curDate,dx<0?1:-1);loadDay()}},{passive:true});

setSync();renderDay();
if(!cfg.url||!cfg.token)openSettings(true);
else{refreshDb().then(()=>renderDay()).catch(()=>{});loadDay();flush()}
</script>
